titol: "Bisect: troba el primer commit que falla"
titol_curt: BISECT
capcalera: [BISECT, Troba el primer commit que falla]
presentacio: "[[Bisect]]"
objectiu: localitzar el primer commit que falla amb una prova que es pugui repetir, i tancar la cerca.
inici: >-
  Historial lineal de vuit commits, A a H, main a H i treball net. L’etiqueta v1.0, la primera entrega, és a B
  i funciona. D introdueix un error que es manté fins a H. E a H només toquen notes.md.
inici_parlat: >-
  La primera entrega, l’etiqueta v u punt zero, funcionava. Després hi ha sis commits més i ara el programa falla.
preparacio:
  - repositori: HelloGit
  - fitxer: helloGit.py
    contingut: print("Hello Git")
  - git: add helloGit.py
  - commit: A
    missatge: Afegeix la salutacio inicial
  - fitxer: helloGit.py
    contingut: print("Hello Git!")
  - git: commit -q -am "Afegeix una exclamacio"
  - etiqueta: B
  - git: tag -a v1.0 -m "Primera entrega"
  - fitxer: helloGit.py
    contingut: |-
      # Salutació del projecte
      print("Hello Git!")
  - git: commit -q -am "Afegeix un comentari"
  - etiqueta: C
  - fitxer: helloGit.py
    contingut: |-
      # Salutació del projecte
      print(salutacio)
  - git: commit -q -am "Prepara la salutacio personalitzada"
  - etiqueta: D
  - fitxer: notes.md
    contingut: Idea 1
  - git: add notes.md
  - commit: E
    missatge: Comença les notes
  - fitxer: notes.md
    contingut: Idea 1, idea 2
  - git: commit -q -am "Amplia les notes"
  - etiqueta: F
  - fitxer: notes.md
    contingut: Idea 1, idea 2, idea 3
  - git: commit -q -am "Completa les notes"
  - etiqueta: G
  - fitxer: notes.md
    contingut: Idees revisades
  - git: commit -q -am "Revisa les notes"
  - etiqueta: H

etapes:
  - explica: Acotar l’error amb una prova
    text: >-
      Sabem una versió que funciona i una que falla. [[Bisect]] tria versions intermèdies perquè les provem
      i cada resposta redueix a la meitat els commits sospitosos. La prova ha de ser sempre la mateixa.
    visual: Graf de vuit commits; v1.0 a B amb FUNCIONA i H amb FALLA. Prova fixa python3 helloGit.py.

  - plantilla: status-breu
    resultat: No hi ha canvis pendents que es puguin barrejar amb les versions que anirem provant.
    comprova: {status: ""}

  - ordre: git bisect start
    text: "[[git bisect]] [[start]] comença la cerca."
    resultat: La cerca està oberta i espera que indiquem els dos extrems.
    visual: Indicador CERCA ACTIVA. main continua a H.

  - ordre: git bisect bad
    text: Marquem la versió actual com la que falla.
    parts:
      - bad: Diu que la prova falla en el commit on som, el darrer.
    resultat: El darrer commit és l’extrem que falla.
    visual: H amb l’etiqueta FALLA, a més del color.

  - ordre: git bisect good v1.0
    text: Indiquem la versió que sabem que funciona.
    parts:
      - good: Diu que aquesta versió supera la prova.
      - v1.0: És l’etiqueta de la primera entrega.
    resultat: >-
      [[Git]] ens porta a un commit del mig per provar-lo. La nostra branca no es mou; només canvia la versió
      dels fitxers.
    visual: HEAD es desplaça al commit triat; main quieta a H.
    comprova:
      head: separat:E

  - explica: HEAD separat
    text: >-
      Durant la cerca, [[HEAD]] no segueix cap branca: apunta directament a un commit. [[Git]] en diu
      [[HEAD]] separat. És normal aquí, però no és el moment de fer commits nous.
    visual: HEAD desenganxat de main i apuntant a E. Etiqueta HEAD SEPARAT.

  - plantilla: programa
    falla: true
    text: Executem exactament la mateixa prova.
    resultat: Falla amb un error de nom. Comuniquem aquest resultat a la cerca.
    comprova:
      sortida: [NameError]

  - ordre: git bisect bad
    text: Marquem aquesta versió com a fallida.
    resultat: "[[Git]] descarta els commits posteriors i ens porta a un commit anterior."
    visual: Els commits de E a H passen a DESCARTATS; HEAD es desplaça a D.
    comprova:
      head: separat:D

  - plantilla: programa
    falla: true
    text: Repetim la prova.
    resultat: Aquesta versió també falla.
    comprova:
      sortida: [NameError]

  - ordre: git bisect bad
    text: La marquem com a fallida.
    resultat: Només queda un commit per provar, l’anterior.
    visual: D marcat FALLA; HEAD es desplaça a C.
    comprova:
      head: separat:C

  - plantilla: programa
    text: Provem aquesta versió de la mateixa manera.
    resultat: Ara la salutació funciona.
    comprova: {programa: Hello Git!}

  - ordre: git bisect good
    text: Marquem el resultat correcte.
    resultat: >-
      Només queda un candidat, i [[Git]] l’anuncia com el primer commit que falla. Ja sabem quin canvi hem de
      revisar, però encara no l’hem arreglat.
    visual: Ressaltar D com a RESULTAT a la sortida real. HEAD continua a C, l’últim commit provat.
    comprova:
      sortida: ["{D}", is the first]
      head: separat:C

  - ordre: git show {D} -- helloGit.py
    text: Revisem el canvi trobat.
    parts:
      - "{D}": És l’identificador que ha trobat la cerca.
    resultat: El canvi fa servir una variable que no existeix. Consultar-lo no mou [[HEAD]].
    visual: Diff real de D al costat del resultat de la prova.

  - ordre: git bisect reset
    text: Tanquem la cerca.
    parts:
      - reset: Dins de [[bisect]], [[reset]] acaba la sessió i torna a la branca d’abans. No té res a veure amb [[git reset]].
    resultat: Tornem a [[main]], al darrer commit. No s’ha creat cap commit; ara toca corregir l’error.
    visual: Desapareix CERCA ACTIVA; HEAD torna a unir-se a main a H.
    comprova:
      head: main
      refs: {main: H}

resum:
  - Calen una prova repetible i dos extrems coneguts.
  - Provem cada versió abans de dir si és bona o dolenta.
  - "[[Bisect]] troba el commit; després tanquem la cerca i el corregim."
practica: >-
  En un historial de pràctiques amb un error que es manté, marca un extrem que funciona i un que falla.
  Fes servir sempre la mateixa prova i acaba la cerca amb [[git bisect]] [[reset]].
