# Sèrie «Píndoles de Git». L’ordre de `llicons` determina la numeració dels vídeos,
# la capçalera i la presentació parlada. Després de reordenar, executeu
# `python -m motor.serie Git --renumera` perquè les carpetes NN-nom coincideixin.
nom: Píndoles de Git
etiqueta_curta: Git
fps: 24
veu:
  nom: en-US-AndrewMultilingualNeural
  velocitats: {ca-ES: "+5%", en-US: "+0%"}
  pausa_canvi_idioma_ms: 500
  endpoint: https://optimisme-6938-resource.cognitiveservices.azure.com/
# Carpeta dels vídeos finals (MP4), relativa a la carpeta de la sèrie. La resta de
# fitxers produïts de cada lliçó queden a NN-nom/output/.
videos: output
# URL pública de la carpeta de la sèrie (per exemple, a GitHub). Si és buida,
# les descripcions de YouTube indiquen el camí relatiu dels scripts de pràctica.
web: ""
youtube:
  llista: Píndoles de Git
  etiquetes: [git, github, control de versions, programació, català, tutorial]

