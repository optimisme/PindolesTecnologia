titol: "Add interactiu: prepara només una part del fitxer"
titol_curt: ADD INTERACTIU
capcalera: [ADD INTERACTIU, Prepara només una part del fitxer]
presentacio: "[[Add]] interactiu"
objectiu: preparar només una part d’un fitxer i deixar l’altra edició pendent al treball.
inici: >-
  helloGit.py ja seguit, amb les funcions saluda, doble, suma i comiat (exemples/helloGit-abans.py).
  Sense canvis pendents. Les edicions de saluda i comiat queden prou separades per formar dos blocs de diff.
inici_parlat: >-
  El programa té una funció de salutació i una de comiat, separades per altres funcions. Ja està
  confirmat i no tenim canvis pendents.
preparacio:
  - repositori: HelloGit
  - fitxer: helloGit.py
    origen: exemples/helloGit-abans.py
  - git: add helloGit.py
  - commit: A
    missatge: Afegeix salutacio i comiat

etapes:
  - explica: Dues edicions, dos canvis separables
    pantalla:
      - "saluda():  return \"Hola, Ermessenda!\""
      - "comiat():  return \"Adéu!\""
      - "Volem confirmar només la salutació."
    text:
      - Mostrem el programa complet abans d’editar-lo. La salutació és a dalt i el comiat, a baix.
      - >-
        Canviem la salutació per Hola, Ermessenda! i el comiat per Adéu! Volem confirmar ara només la salutació
        i deixar el comiat per a més endavant.
    visual: >-
      Editor amb el codi complet de exemples/helloGit-abans.py; després, l’editat de exemples/helloGit-editat.py
      amb les dues funcions modificades ressaltades per torns i les funcions del mig sense canvis.
    accions:
      - fitxer: helloGit.py
        origen: exemples/helloGit-editat.py

  - ordre: git diff -- helloGit.py
    text: Revisem els canvis abans de seleccionar-los.
    parts:
      - "--": Els dos guionets separen les opcions del nom del fitxer.
      - helloGit.py: Consultem els canvis d’aquest fitxer.
    resultat: El primer bloc canvia la salutació i el segon, el comiat. Cada bloc comença amb una línia de dues arrobes.
    visual: Sortida real amb els dos blocs numerats BLOC 1 i BLOC 2.

  - ordre: git add -p helloGit.py
    text: Entrem a la preparació interactiva.
    parts:
      - -p: El guionet pe permet triar els blocs de canvi un per un.
      - helloGit.py: Limitem la selecció a aquest fitxer.
    entrada: "y\nn\n"
    resultat: >-
      [[Git]] mostra el primer bloc i espera una resposta. Ara no escrivim cap ordre nova: responem a
      la pregunta que ha fet.
    visual: >-
      Terminal en mode INTERACTIU amb el primer bloc de la salutació i la llista d’opcions. La sortida
      real completa inclou també el segon bloc; mostrar-la per parts.
    comprova:
      index_igual_a: {helloGit.py: exemples/helloGit-preparat.py}
      treball_igual_a: {helloGit.py: exemples/helloGit-editat.py}

  - ordre: y
    tipus: interactiu
    text: Responem i grega, de [[yes]], per preparar el primer bloc.
    resultat: La salutació passa a la preparació, i la mateixa sessió ens mostra el segon bloc.
    visual: Moure només el bloc de la salutació del treball a la preparació.

  - ordre: n
    tipus: interactiu
    text: Responem ena per deixar fora el segon bloc.
    resultat: El comiat es queda al treball. Com que no hi ha més blocs, tornem a la terminal normal.
    visual: El comiat es queda al panell TREBALL. Torna a aparèixer el símbol habitual de la terminal.

  - ordre: git diff --staged
    text: Comprovem què hem preparat.
    resultat: Només hi ha la salutació nova. Aquesta és la selecció que entrarà al commit.
    visual: Fletxa ÚLTIM COMMIT → PREPARACIÓ; el comiat antic continua igual a totes dues zones.
    comprova:
      sortida: ['+    return "Hola, Ermessenda!"']

  - ordre: git diff
    text: Comprovem què queda pendent.
    resultat: Només hi surt el comiat nou. La salutació ja coincideix entre el treball i la preparació.
    visual: Fletxa PREPARACIÓ → TREBALL; ressaltar el comiat sense preparar.
    comprova:
      sortida: ['+    return "Adéu!"']

  - plantilla: commit
    missatge: Personalitza la salutacio
    crea: B
    resultat: El commit guarda la salutació. L’edició del comiat continua al treball; el commit no l’ha esborrat.
    comprova:
      status: " M helloGit.py"

  - explica: El bloc és la unitat de selecció
    pantalla:
      - "Blocs separats:  y / n per a cada un"
      - "Un bloc conjunt:  s per dividir-lo"
    text: >-
      Aquí les dues edicions eren prou lluny per formar dos blocs. Si [[Git]] les ajunta en un de sol,
      el bloc es pot dividir amb l’opció essa de la mateixa llista.
    visual: Comparació DOS BLOCS SEPARATS / UN BLOC CONJUNT. En el bloc conjunt, la llista de respostes de mostra inclou la s de dividir.

resum:
  - Amb el guionet pe, [[git add]] permet preparar blocs concrets d’un fitxer.
  - Les respostes i grega i ena pertanyen a la sessió interactiva, no a la terminal.
  - El commit guarda la selecció i deixa la resta d’edicions al treball.
practica: >-
  En un fitxer de pràctiques amb dues edicions separades, prepara un bloc i deixa’n l’altre. Compara
  els dos diffs abans de confirmar.
