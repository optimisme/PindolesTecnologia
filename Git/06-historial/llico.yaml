titol: "Llegir l’historial: log, show i diff"
titol_curt: HISTORIAL
capcalera: ["LLEGIR L’HISTORIAL", "Qui, quan i què ha canviat"]
presentacio: Llegir l’historial
objectiu: consultar els commits d’un projecte, veure què va canviar cadascun i comparar dues versions.
inici: >-
  HelloGit a main amb tres commits: A crea la salutació, B hi afegeix una exclamació i C afegeix un comiat.
  Sense canvis pendents.
inici_parlat: >-
  Partim d’un projecte amb tres commits a [[main]]: la salutació inicial, una exclamació i un comiat.
preparacio:
  - repositori: HelloGit
  - fitxer: helloGit.py
    contingut: print("Hello Git")
  - git: add helloGit.py
  - commit: A
    missatge: Afegeix la salutacio inicial
  - fitxer: helloGit.py
    contingut: print("Hello Git!")
  - git: add helloGit.py
  - commit: B
    missatge: Afegeix una exclamacio
  - fitxer: helloGit.py
    contingut: |-
      print("Hello Git!")
      print("Fins aviat!")
  - git: add helloGit.py
  - commit: C
    missatge: Afegeix un comiat

etapes:
  - explica: L’historial és una llista de commits
    pantalla:
      - "Cada commit guarda:"
      - "una instantània del projecte"
      - "qui la va fer i quan"
      - "un missatge que explica el canvi"
    text: >-
      Cada commit guarda una instantània del projecte, qui la va fer, quan i un missatge. Llegir
      l’historial ens ajuda a entendre com hem arribat a la versió actual.
    visual: Línia de temps A, B i C amb els missatges reals.

  - ordre: git log
    text: "[[git log]] mostra els commits de la branca actual."
    resultat: >-
      Surten del més recent al més antic. Cada un té un identificador llarg, l’autoria, la data i el missatge.
      Si la llista és llarga, sortim de la vista amb la tecla q.
    visual: Sortida real; ressaltar per torns l’identificador, l’autoria, la data i el missatge del primer commit.
    comprova:
      sortida: [Afegeix un comiat, Afegeix una exclamacio, Afegeix la salutacio inicial, "Author: Ermessenda Carcassona"]

  - ordre: git log --oneline
    text: Ara en demanem un resum.
    parts:
      - --oneline: Doble guionet [[oneline]] mostra cada commit en una sola línia, amb l’identificador abreujat.
    resultat: >-
      Els set primers caràcters de l’identificador són suficients per referir-nos a un commit en aquest projecte.
    visual: Sortida real en tres línies; relacionar cada línia amb A, B i C de la línia de temps.
    comprova:
      sortida: ["{C} Afegeix un comiat", "{A} Afegeix la salutacio inicial"]

  - explica: HEAD i els passos enrere
    pantalla:
      - "On som ara:  HEAD"
      - "Un commit enrere:  HEAD~1"
      - "Dos commits enrere:  HEAD~2"
    text:
      - >-
        [[HEAD]] és el commit on som ara; en aquest exemple, el darrer de [[main]]. Per anomenar commits
        anteriors sense copiar identificadors, hi afegim una titlla i un número.
      - "[[HEAD]] titlla u és el commit anterior; [[HEAD]] titlla dos, dos passos enrere."
    visual: Línia de temps amb HEAD a C, HEAD~1 a B i HEAD~2 a A. Ressaltar cada etiqueta per torns.

  - ordre: git show HEAD
    text: "[[git show]] mostra el contingut d’un commit."
    parts:
      - HEAD: Consultem el commit actual, el del comiat.
    resultat: >-
      Primer surten les dades del commit i després el canvi. La línia amb el signe més és la que s’hi va afegir.
    visual: Sortida real; separar DADES DEL COMMIT i CANVI amb una línia.
    comprova:
      sortida: ['+print("Fins aviat!")']

  - ordre: git show HEAD~1
    text: Consultem el commit anterior.
    parts:
      - HEAD~1: Un pas enrere des d’on som; és el commit de l’exclamació.
    resultat: Hi veiem la línia antiga, sense exclamació, i la nova, amb exclamació.
    visual: Sortida real; ressaltar la parella de línies menys i més.
    comprova:
      sortida: ['-print("Hello Git")', '+print("Hello Git!")']

  - ordre: git diff HEAD~2 HEAD -- helloGit.py
    text: "[[git diff]] també compara dues versions qualssevol."
    parts:
      - HEAD~2: El primer punt de comparació és la salutació inicial.
      - HEAD: El segon és la versió actual.
      - "--": Els dos guionets separen les versions del nom del fitxer.
      - helloGit.py: Limitem la comparació al programa.
    resultat: >-
      La comparació acumula els dos canvis: l’exclamació i el comiat. No modifica cap fitxer; només els llegeix.
    visual: Sortida real; esquema A → C amb els dos canvis agrupats.
    comprova:
      sortida: ['-print("Hello Git")', '+print("Hello Git!")', '+print("Fins aviat!")']
      status: ""

  - explica: Com es llegeix un diff
    pantalla:
      - "Línia esborrada:  - print(\"Hello Git\")"
      - "Línia afegida:  + print(\"Hello Git!\")"
      - "Les línies sense signe són context."
    text: >-
      Les línies amb el signe menys desapareixen, i les del signe més s’hi afegeixen. Les línies sense signe
      són context, per situar el canvi dins del fitxer.
    visual: Diff anotat amb tres etiquetes textuals, ESBORRADA, AFEGIDA i CONTEXT, a més dels colors.

resum:
  - "[[git log]] llista els commits; doble guionet [[oneline]] en fa un resum."
  - "[[git show]] explica què va canviar un commit concret."
  - "[[git diff]] compara dues versions sense modificar cap fitxer."
practica: >-
  En un repositori teu amb uns quants commits, llegeix l’historial resumit, consulta el commit anterior
  a l’actual i compara la primera versió amb la darrera.
