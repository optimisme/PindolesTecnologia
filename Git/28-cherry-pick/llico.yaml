titol: "Cherry-pick: porta una correcció a una altra branca"
titol_curt: CHERRY-PICK
capcalera: [CHERRY-PICK, Porta una correcció a una altra branca]
presentacio: "[[Cherry-pick]]"
objectiu: aplicar a [[main]] només una correcció d’una altra branca, sense portar-hi la resta de la feina.
inici: >-
  main a B, amb una errada d’ortografia a la salutació (Helo). salutacio té C, que afegeix notes d’una feina
  pendent, i D, que només corregeix l’errada. Treball net; D no depèn de C.
inici_parlat: >-
  [[main]] té una errada a la salutació. A la branca salutació, entre altres feines encara pendents, ja
  hi ha un commit que la corregeix.
preparacio:
  - repositori: HelloGit
  - fitxer: helloGit.py
    contingut: print("Hello Git")
  - git: add helloGit.py
  - commit: A
    missatge: Afegeix la salutacio inicial
  - fitxer: helloGit.py
    contingut: print("Helo Git!")
  - git: commit -q -am "Afegeix una exclamacio"
  - etiqueta: B
  - git: switch -q -c salutacio
  - fitxer: notes.md
    contingut: Idees pendents per a la salutació
  - git: add notes.md
  - commit: C
    missatge: Comença les notes de la salutacio
  - fitxer: helloGit.py
    contingut: print("Hello Git!")
  - git: commit -q -am "Corregeix l'errada de la salutacio"
  - etiqueta: D

camins:
  conflicte:
    tipus: condicional
    titol: Si hi ha conflicte
    des_de: inici
    preparacio:
      - git: switch -q main
      - fitxer: helloGit.py
        contingut: print("Helo, Git!")
      - git: commit -q -am "Afegeix una coma"
      - git: cherry-pick {D}
        falla: true
  avorta:
    tipus: alternatiu
    titol: Alternativa
    des_de: inici
    preparacio:
      - git: switch -q main
      - fitxer: helloGit.py
        contingut: print("Helo, Git!")
      - git: commit -q -am "Afegeix una coma"
      - git: cherry-pick {D}
        falla: true

etapes:
  - explica: Una correcció dins d’una altra feina
    pantalla:
      - "C:  notes d’una feina pendent"
      - "D:  corregeix l’errada"
      - "Només volem D a main."
    text: >-
      La branca de la salutació conté una feina encara pendent i una correcció que necessitem ara a [[main]].
      Portarem només la correcció, després de comprovar que no depèn de la resta.
    visual: Graf main a B; salutacio a D, amb C entremig. C · notes.md; D · correcció de helloGit.py.

  - ordre: git log --oneline salutacio
    text: Busquem el commit de la correcció.
    parts:
      - salutacio: Consultem la història d’aquesta branca, sense canviar-hi.
    resultat: El primer de la llista és la correcció. En copiem l’identificador.
    visual: Ressaltar D a la sortida real i deixar C visible com a FEINA PENDENT.
    comprova:
      sortida: ["{D} Corregeix l'errada de la salutacio"]

  - ordre: git show {D} -- helloGit.py
    text: Revisem què canvia aquest commit.
    parts:
      - "{D}": És l’identificador que hem copiat.
    resultat: Només corregeix la salutació; no necessita les notes del commit anterior.
    visual: Diff real amb només la correcció; panell notes.md EXCLÒS.

  - plantilla: status-breu
    resultat: No hi ha feina pendent que es pugui barrejar amb l’operació.
    comprova: {status: ""}

  - plantilla: switch
    branca: main
    resultat: La correcció s’aplicarà a [[main]], que ara és la branca activa.
    comprova: {head: main}

  - ordre: git cherry-pick {D}
    text: "[[git cherry-pick]] torna a aplicar a la branca activa el canvi d’un commit concret."
    parts:
      - "{D}": Indiquem només la correcció, no tota la branca de la salutació.
    crea: E
    resultat: >-
      Es crea un commit nou a [[main]], amb el mateix canvi i un identificador diferent. La branca de la
      salutació es queda com estava.
    visual: Crear E com a fill de B. Relació conceptual de canvi D → E, diferent d’una relació de pare.
    comprova:
      pares: {E: [B]}
      refs: {salutacio: D}
      no_existeix: [notes.md]

  - plantilla: programa
    resultat: La salutació ja és correcta a [[main]], i les notes pendents no hi han entrat.
    comprova: {programa: Hello Git!}

  - explica: Si l’aplicació s’atura
    pantalla:
      - "Conflicte a la mateixa línia"
      - "Resolem:  print(\"Hello, Git!\")"
      - "Després:  provar, add i --continue"
    cami: conflicte
    text: >-
      En un altre cas, [[main]] havia canviat la mateixa línia i l’operació s’atura amb un conflicte.
      Escrivim el resultat correcte i el provem.
    visual: Panell condicional amb el conflicte real al fitxer.
    accions:
      - fitxer: helloGit.py
        contingut: print("Hello, Git!")

  - plantilla: programa
    cami: conflicte
    resultat: La resolució funciona.
    comprova: {programa: "Hello, Git!"}

  - plantilla: add-breu
    cami: conflicte
    resultat: La resolució queda preparada.

  - ordre: git cherry-pick --continue
    cami: conflicte
    text: Reprenem l’operació pausada.
    parts:
      - --continue: Continua el [[cherry-pick]] pendent; no en comença cap de nou.
    resultat: Es crea el commit amb la resolució. Pot obrir l’editor amb el missatge original; el desem i el tanquem.
    visual: Només el camí CONTINUAR del cas amb conflicte.
    comprova:
      status: ""
      programa: Hello, Git!

  - explica: Alternativa, abandonar
    pantalla:
      - "Continuar:  git cherry-pick --continue"
      - "Abandonar:  git cherry-pick --abort"
    cami: avorta
    text: Des del mateix conflicte, també podem abandonar l’operació.
    visual: Bifurcació AVORTAR des del conflicte, mai després de continuar.

  - ordre: git cherry-pick --abort
    cami: avorta
    text: Cancel·lem el [[cherry-pick]] pendent.
    parts:
      - --abort: Torna a l’estat d’abans de començar.
    resultat: "[[main]] queda com estava abans d’intentar-ho."
    visual: Desapareixen el conflicte i l’indicador d’operació pendent.
    comprova:
      status: ""
      programa: Helo, Git!

resum:
  - Triem un commit concret i comprovem que no depengui d’altres canvis.
  - La branca activa rep un commit nou, amb un pare i un identificador diferents.
  - La branca original es conserva; el resultat s’ha de provar.
practica: >-
  En un repositori de pràctiques, crea en una branca una correcció independent d’una altra feina. Porta
  només la correcció a [[main]] i comprova els fitxers de les dues branques.
