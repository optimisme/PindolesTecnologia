titol: "Gitignore: deixa fora els fitxers generats"
titol_curt: GITIGNORE
capcalera: [GITIGNORE, Deixa fora els fitxers generats]
presentacio: "[[Gitignore]]"
objectiu: ignorar els fitxers que genera el programa i distingir-los dels que [[Git]] ja seguia.
inici: >-
  HelloGit amb helloGit.py, salutacions.py i un registre antic app.log, tots tres confirmats. El programa
  importa salutacions.py i escriu cada execució a debug.log. Encara no hi ha .gitignore.
inici_parlat: >-
  El programa fa servir un segon fitxer amb les salutacions i deixa un registre de cada execució.
  Fa temps, també vam confirmar per error un registre antic.
preparacio:
  - repositori: HelloGit
  - fitxer: salutacions.py
    contingut: |-
      def saluda():
          return "Hola, Anna!"
  - fitxer: helloGit.py
    contingut: |-
      from salutacions import saluda

      missatge = saluda()
      with open("debug.log", "a") as registre:
          registre.write(missatge + "\n")
      print(missatge)
  - fitxer: app.log
    contingut: Registre d’una versió antiga
  - git: add helloGit.py salutacions.py app.log
  - commit: A
    missatge: Afegeix el programa i les salutacions

etapes:
  - explica: Codi i fitxers generats
    text: >-
      Volem versionar el codi. Els fitxers que crea el programa quan s’executa, com els registres o la
      memòria cau de [[Python]], no han d’entrar als commits.
    visual: Targetes helloGit.py i salutacions.py marcades CODI; app.log marcat REGISTRE ANTIC, JA SEGUIT.

  - plantilla: programa
    resultat: >-
      El programa funciona. En executar-lo, ha creat el registre d’execució i una carpeta de memòria cau,
      perquè importa el fitxer de salutacions.
    visual: Apareixen debug.log i la carpeta __pycache__/ a l’explorador de fitxers.
    comprova:
      programa: Hola, Anna!
      existeix: [debug.log, __pycache__]

  - plantilla: status-breu
    resultat: El registre nou i la carpeta de memòria cau apareixen amb dos interrogants, com a fitxers no seguits.
    comprova: {status: "?? __pycache__/\n?? debug.log"}

  - explica: Escrivim les regles
    text:
      - >-
        Creem el fitxer punt [[gitignore]] a l’arrel del projecte, amb una regla per línia. Asterisc punt
        [[log]] selecciona tots els noms que acaben en punt [[log]].
      - >-
        La segona regla acaba amb una barra i selecciona la carpeta de memòria cau. Aquest fitxer de regles
        sí que el confirmarem, perquè tothom faci servir els mateixos criteris.
    visual: Editor .gitignore amb dues línies literals, *.log i __pycache__/. Ressaltar primer l’asterisc i després la barra final.
    accions:
      - fitxer: .gitignore
        contingut: |-
          *.log
          __pycache__/

  - plantilla: status-breu
    resultat: >-
      El registre nou i la memòria cau ja no hi surten. Només hi apareix el fitxer de regles, perquè encara és nou.
    comprova: {status: "?? .gitignore"}

  - ordre: git check-ignore -v debug.log
    text: "[[git check-ignore]] explica per què s’ignora un fitxer."
    parts:
      - -v: El guionet ve demana el detall de la regla que hi coincideix.
      - debug.log: És el registre que volem investigar.
    resultat: La sortida indica el fitxer de regles, el número de línia i el patró que coincideix amb el registre.
    visual: Separar a la sortida real .gitignore, el número de línia, el patró *.log i el nom del fitxer.
    comprova:
      sortida: [".gitignore:1:*.log\tdebug.log"]

  - explica: Una regla no deixa de seguir un fitxer
    text: >-
      El registre antic també acaba en punt [[log]], però ja formava part d’un commit. Les regles només
      afecten els fitxers que [[Git]] encara no seguia.
    visual: app.log amb l’etiqueta SEGUIT i debug.log amb l’etiqueta IGNORAT.

  - ordre: git ls-files
    text: Llistem els fitxers que [[Git]] segueix.
    resultat: El registre antic continua a la llista, al costat del codi.
    visual: Sortida real; ressaltar app.log.
    comprova:
      sortida: [app.log]

  - ordre: git rm --cached app.log
    text: Decidim deixar de seguir el registre antic, però conservar-lo a l’ordinador.
    parts:
      - --cached: Doble guionet [[cached]] el retira només del repositori; el fitxer continua al disc.
      - app.log: És el registre que ja estava seguit.
    resultat: >-
      Queda preparada la retirada del registre. Com que ara coincideix amb una regla, el fitxer local
      ja no apareix com a nou.
    visual: Retirar app.log del panell PREPARACIÓ amb una D; mantenir-lo a la carpeta de treball, sense animació d’esborrar.
    comprova:
      status: "D  app.log\n?? .gitignore"
      existeix: [app.log]

  - plantilla: add-breu
    fitxer: .gitignore
    resultat: Preparem també les regles. La retirada del registre ja era preparada.
    comprova: {status: "A  .gitignore\nD  app.log"}

  - plantilla: commit-breu
    missatge: Ignora els fitxers generats
    crea: B
    resultat: >-
      El commit guarda les regles i la retirada del registre. El fitxer local continua existint i ara
      queda ignorat.
    comprova:
      status: ""
      existeix: [app.log]
      ignorat: [app.log, debug.log, __pycache__]

resum:
  - Punt [[gitignore]] filtra els fitxers no seguits que coincideixen amb les regles.
  - El fitxer de regles es confirma perquè tothom en comparteixi els criteris.
  - Deixar de seguir un fitxer és una decisió a part; doble guionet [[cached]] el conserva al disc.
practica: >-
  En un projecte de pràctiques, genera un registre executant el programa i crea una regla per ignorar-lo.
  Comprova la regla amb [[git check-ignore]] i compara-ho amb un fitxer que ja estigui seguit.
