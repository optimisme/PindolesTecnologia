titol: "Revert: desfés un commit publicat"
titol_curt: REVERT
capcalera: [REVERT, Desfés un commit publicat]
presentacio: "[[Revert]]"
objectiu: desfer l’efecte d’un commit ja publicat amb un commit nou que fa el canvi invers.
inici: >-
  main i origin/main a C, un commit ordinari ja publicat que fa servir una variable sense definir.
  Treball net. B té la salutació que funcionava.
inici_parlat: >-
  L’últim commit ja és a [[GitHub]] i ha trencat el programa. Altres persones ja el poden tenir.
preparacio:
  - remot_nu: origin
  - clona: HelloGit
    de: origin
  - cd: HelloGit
  - fitxer: helloGit.py
    contingut: print("Hello Git")
  - git: add helloGit.py
  - commit: A
    missatge: Afegeix la salutacio inicial
  - fitxer: helloGit.py
    contingut: print("Hello Git!")
  - git: commit -q -am "Afegeix una exclamacio"
  - etiqueta: B
  - fitxer: helloGit.py
    contingut: |-
      missatge = "Hola, Anna!"
      print(salutacio)
  - git: commit -q -am "Personalitza la salutacio"
  - etiqueta: C
  - git: push -q -u origin main

etapes:
  - explica: Una correcció que també queda registrada
    text: >-
      Com que el commit ja és compartit, no el traurem de l’historial. Crearem un commit nou que en desfaci
      l’efecte, i així ningú perd la història que ja té.
    visual: Graf A, B i C al local i al remot. C es manté visible durant tota la demostració.

  - plantilla: programa
    falla: true
    resultat: El programa falla amb un error de nom, perquè fa servir una variable que no existeix.
    comprova:
      sortida: [NameError]

  - plantilla: status-breu
    resultat: No tenim edicions pendents, així la correcció no es barrejarà amb altres feines.
    comprova: {status: ""}

  - ordre: git log --oneline
    text: Busquem el commit a l’historial.
    resultat: El primer de la llista és el que ha trencat el programa. En copiem l’identificador.
    visual: Ressaltar la primera línia de la sortida real amb l’etiqueta COPIA EL TEU IDENTIFICADOR.
    comprova:
      sortida: ["{C} Personalitza la salutacio"]

  - ordre: git show {C} -- helloGit.py
    text: Revisem el canvi abans de desfer-lo.
    parts:
      - "{C}": És el commit que hem identificat.
      - helloGit.py: Mirem només el programa.
    resultat: El commit va substituir la salutació que funcionava per una variable sense definir.
    visual: Diff real amb l’abans i el després del mateix fitxer.

  - ordre: git revert --no-edit {C}
    text: "[[git revert]] crea un commit nou amb el canvi invers del que indiquem."
    parts:
      - --no-edit: Accepta el missatge automàtic sense obrir l’editor.
      - "{C}": És el commit que volem desfer.
    crea: D
    resultat: Apareix un commit nou després de l’erroni. El commit erroni continua a l’historial i el nou en desfà l’efecte.
    visual: Afegir D amb C com a pare. No moure main enrere ni esborrar C.
    comprova:
      pares: {D: [C]}
      mateix_arbre: [B, D]
      status: ""

  - plantilla: programa
    resultat: La salutació torna a funcionar.
    comprova: {programa: Hello Git!}

  - plantilla: push
    resultat: El remot rep el commit nou amb un enviament normal. Les altres còpies podran descarregar la correcció.
    comprova:
      remot: {origin: {main: D}}

  - explica: Revert desfà un commit concret
    text: >-
      [[git revert]] no torna tot el projecte a una data anterior: desfà només el commit que li indiquem.
      Els commits posteriors que no hi tinguin relació es conserven.
    visual: Panell amb C, un commit posterior que només toca notes.md i el commit invers de C. Les notes es conserven.

resum:
  - "[[git revert]] crea un commit nou amb el canvi invers."
  - El commit original continua a l’historial i la branca avança.
  - És la manera de desfer canvis que ja hem compartit.
practica: >-
  En un repositori de pràctiques, desfés un commit amb [[git revert]]. Compara el graf abans i després i
  comprova que el commit original hi continua.
