titol: "Branques: prova una idea sense tocar main"
titol_curt: BRANQUES
capcalera: [BRANQUES, Prova una idea sense tocar main]
presentacio: Branques
objectiu: crear una branca, confirmar-hi una prova i tornar a les dues versions.
inici: >-
  Repositori HelloGit a main amb dos commits, A i B. B conté print("Hello Git!") i no hi ha
  canvis pendents. Les lletres del graf són noms didàctics; la pantalla mostra els identificadors reals.
inici_parlat: >-
  Partim d’un projecte amb dos commits a [[main]]. El programa mostra la salutació original
  i no hi ha cap canvi pendent.

preparacio:
  - repositori: HelloGit
  - fitxer: helloGit.py
    contingut: print("Hello Git")
  - git: add helloGit.py
  - commit: A
    missatge: Afegeix la salutacio inicial
  - fitxer: helloGit.py
    contingut: print("Hello Git!")
  - git: add helloGit.py
  - commit: B
    missatge: Afegeix una exclamacio

etapes:
  - explica: Una idea nova, una línia de treball pròpia
    text: >-
      Volem provar una salutació personalitzada sense perdre la versió que ja funciona a [[main]].
      Una branca ens permet continuar aquesta prova amb commits propis.
    visual: Editor amb print("Hello Git!") i, al costat, la proposta encara no aplicada print("Hola, Anna!").

  - explica: Una branca és una etiqueta
    text: >-
      Una branca és una etiqueta que apunta a un commit. Crear-ne una no copia els fitxers ni crea
      cap commit. Dues etiquetes poden apuntar al mateix lloc.
    visual: Graf amb A i B; etiqueta main a B. Afegir l’etiqueta salutacio a B sense crear cap node.

  - plantilla: status-breu
    resultat: No surt cap línia, perquè no hi ha canvis pendents. Això no vol dir que el programa funcioni; només que no hi ha res per confirmar.
    comprova: {status: ""}

  - plantilla: switch-crea
    branca: salutacio
    resultat: La branca activa ara és salutació. [[main]] continua al mateix commit, i tampoc s’ha creat cap commit nou.
    visual: Etiquetes main i salutacio a B; l’indicador de branca activa passa a salutacio.
    comprova: {head: salutacio, refs: {main: B, salutacio: B}}

  - explica: Editem la salutació
    text: Canviem la salutació i desem el fitxer. De moment, el canvi només és a la carpeta de treball.
    visual: Editor amb print("Hola, Anna!") desat.
    accions:
      - fitxer: helloGit.py
        contingut: print("Hola, Anna!")

  - plantilla: programa
    resultat: Surt la salutació personalitzada. El canvi encara no està preparat ni confirmat.
    comprova: {programa: "Hola, Anna!"}

  - plantilla: add-breu
    resultat: La salutació nova queda preparada. Encara no hi ha cap versió nova a l’historial.
    comprova: {status: "M  helloGit.py"}

  - plantilla: commit-breu
    missatge: Personalitza la salutacio
    crea: C
    resultat: El commit nou fa avançar salutació. [[main]] continua apuntant a la versió original.
    visual: Nou node C després de B; l’etiqueta salutacio avança fins a C i main es queda a B.
    comprova: {refs: {main: B, salutacio: C}, status: ""}

  - plantilla: switch
    branca: main
    resultat: Tornem a veure la salutació original. El commit de la prova continua guardat a la branca salutació.
    visual: L’indicador de branca activa torna a main; l’editor mostra print("Hello Git!"). C continua al graf.
    comprova: {head: main, treball: {helloGit.py: print("Hello Git!")}}

  - plantilla: switch
    branca: salutacio
    resultat: Recuperem la salutació personalitzada. Canviar de branca no ha esborrat cap de les dues versions.
    visual: L’indicador torna a salutacio i l’editor mostra print("Hola, Anna!").
    comprova: {head: salutacio, programa: "Hola, Anna!"}

  - explica: La branca activa
    text: >-
      [[HEAD]] indica on estem treballant; en aquest exemple segueix la branca activa. El nom [[main]]
      és només una convenció: no garanteix que el programa funcioni.
    visual: HEAD unit a salutacio; main quieta a B. El nom de la branca activa també es veu a la terminal.

resum:
  - Crear una branca afegeix una etiqueta; no crea cap commit.
  - Un commit fa avançar només la branca activa.
  - Canviar de branca recupera la seva versió; integrar-la a [[main]] serà un pas posterior.
practica: >-
  En un repositori de pràctiques sense canvis pendents, crea una branca de prova, confirma-hi una
  salutació diferent i alterna les dues branques per comparar el fitxer.
