titol: "Connectar amb GitHub: accés i primer clon"
titol_curt: GITHUB
capcalera: [CONNECTAR AMB GITHUB, Accés des de la terminal i primer clon]
presentacio: Connectar amb [[GitHub]]
objectiu: >-
  autoritzar la terminal per treballar amb [[GitHub]] i clonar un repositori buit per començar el projecte.
inici: >-
  Git configurat com a la lliçó anterior. Compte de GitHub creat. GitHub CLI instal·lat o pendent
  d’instal·lar. Les pantalles web i les sortides de gh són de mostra; el clon s’executa contra un remot local.
inici_parlat: >-
  Tenim [[Git]] configurat i un compte de [[GitHub]]. Ara connectarem la terminal amb aquest compte.
urls:
  <URL-del-repositori>: origin
carpeta: .
preparacio:
  - remot_nu: origin

etapes:
  - explica: Dues eines, dues funcions
    pantalla:
      - "Git · treballa al nostre ordinador"
      - "GitHub · servei per guardar i compartir còpies"
      - "Per enviar-hi commits, la terminal ha de demostrar qui som."
      - "La contrasenya del compte no serveix per a la terminal."
    text:
      - "[[Git]] treballa al nostre ordinador. [[GitHub]] és un servei on guardem una còpia per compartir-la."
      - >-
        Per enviar-hi commits, la terminal ha de demostrar qui som. La contrasenya del compte no serveix
        per a la terminal: necessitem una autorització pròpia.
    visual: Ordinador amb Git a l’esquerra, núvol de GitHub a la dreta i un cadenat a la fletxa que els uneix.

  - explica: Instal·lem GitHub CLI
    pantalla:
      - "macOS:  brew install gh"
      - "Windows:  winget install --id GitHub.cli"
      - "Linux:  el gestor de paquets de la distribució"
      - "Comprovació:  gh --version"
    text: >-
      Farem servir [[GitHub CLI]], l’eina oficial de [[GitHub]] per a la terminal. La instal·lem amb el
      gestor de paquets del sistema; a la pantalla veus l’ordre per a cada sistema.
    visual: >-
      Tres targetes: macOS · brew install gh / Windows · winget install --id GitHub.cli /
      Linux · el gestor de paquets de la distribució.

  - ordre: gh auth login
    text: Amb [[gh auth login]] iniciem l’autorització.
    simulat: true
    sortida_mostra: |-
      ? Where do you use GitHub? GitHub.com
      ? What is your preferred protocol for Git operations on this host? HTTPS
      ? Authenticate Git with your GitHub credentials? Yes
      ? How would you like to authenticate GitHub CLI? Login with a web browser

      ! First copy your one-time code: 1A2B-3C4D
      Press Enter to open https://github.com/login/device in your browser...
    resultat: >-
      Responem amb les fletxes i la tecla de retorn: [[GitHub]] punt com, protocol HTTPS, autoritzar
      [[Git]] i iniciar sessió amb el navegador. Copiem el codi que apareix i el confirmem a la pàgina que s’obre.
    pausa: 4
    visual: >-
      Sortida de mostra amb les quatre preguntes ressaltades per torns; després, navegador amb el camp
      del codi d’un sol ús. Codi i compte inventats.

  - ordre: gh auth status
    text: Comprovem que la terminal ja està autoritzada.
    simulat: true
    sortida_mostra: |-
      github.com
        ✓ Logged in to github.com account ermessenda-carcassona (keyring)
        - Active account: true
        - Git operations protocol: https
        - Token: gho_************************************
    resultat: >-
      Indica el compte connectat i que [[Git]] farà servir HTTPS. El codi d’accés queda desat de manera segura
      al sistema; no l’hem d’escriure ni compartir.
    visual: Sortida de mostra; ressaltar el nom del compte i la línia del protocol. El token surt amagat amb asteriscos.

  - explica: Una alternativa a Windows
    pantalla:
      - "L’instal·lador de Git per a Windows inclou un gestor d’accés."
      - "El primer git push obre el navegador i desa l’autorització."
      - "Qualsevol dels dos camins serveix."
    text: >-
      A Windows, l’instal·lador de [[Git]] també inclou un gestor d’accés. El primer cop que enviem commits,
      obre el navegador i desa l’autorització. Qualsevol dels dos camins serveix.
    visual: Finestra d’inici de sessió del gestor de credencials de Git per a Windows, com a camí alternatiu.

  - explica: Creem un repositori buit
    pantalla:
      - "github.com → New repository"
      - "Nom: HelloGit"
      - "Sense README, .gitignore ni llicència"
      - "Botó Code → copiem l’adreça HTTPS"
    text: >-
      A la web de [[GitHub]], creem un repositori nou anomenat HelloGit. No hi afegim cap fitxer inicial:
      el començarem des de l’ordinador.
    visual: >-
      Esquema del formulari New repository: nom HelloGit, opcions README, .gitignore i llicència desmarcades.
      Botó Code amb l’adreça HTTPS ressaltada.

  - ordre: git clone <URL-del-repositori> HelloGit
    text: Amb [[git clone]] creem la còpia local del repositori.
    parts:
      - <URL-del-repositori>: >-
          Substituïm aquest marcador per l’adreça que hem copiat del botó [[Code]]. No escrivim els signes
          de menor i major.
      - HelloGit: És el nom de la carpeta nova que es crearà.
    resultat: >-
      [[Git]] avisa que el repositori és buit. És el que esperàvem: ja tenim la carpeta connectada amb [[GitHub]].
    sortida_mostra: |-
      Cloning into 'HelloGit'...
      warning: You appear to have cloned an empty repository.
    visual: Animació de la carpeta HelloGit que apareix a l’ordinador, unida al repositori de GitHub.
    comprova:
      existeix: [HelloGit/.git]

  - ordre: cd HelloGit
    text: Entrem a la carpeta del projecte amb l’ordre cd.
    parts:
      - HelloGit: És la carpeta que acabem de crear. Les ordres següents s’executen des de dins.
    resultat: La terminal mostra que som dins del projecte.
    visual: El camí de la terminal canvia a ~/HelloGit.

  - ordre: git remote -v
    text: Comprovem amb quin repositori remot està connectada la carpeta.
    parts:
      - -v: El guionet ve mostra també les adreces.
    resultat: >-
      El remot es diu [[origin]] i apunta al repositori de [[GitHub]], tant per descarregar com per enviar.
    sortida_mostra: |-
      origin	https://github.com/ermessenda-carcassona/HelloGit.git (fetch)
      origin	https://github.com/ermessenda-carcassona/HelloGit.git (push)
    visual: Sortida de mostra; ressaltar el nom origin i l’adreça del compte d’exemple.
    comprova:
      sortida: [origin]

resum:
  - La terminal necessita una autorització pròpia per treballar amb [[GitHub]].
  - "[[gh auth login]] la crea i [[gh auth status]] la comprova."
  - "[[git clone]] crea la carpeta local connectada al remot [[origin]]."
practica: >-
  Autoritza la terminal amb el teu compte, crea un repositori buit de pràctiques a [[GitHub]] i clona’l
  en una carpeta nova. Comprova el remot abans de continuar.
