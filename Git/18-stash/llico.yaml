titol: "Stash: aparca la feina pendent"
titol_curt: STASH
capcalera: [STASH, Aparca la feina pendent]
presentacio: "[[Stash]]"
objectiu: aparcar canvis pendents, atendre una altra tasca i recuperar-los després.
inici: >-
  Branca activa salutacio, al mateix commit que main (B). helloGit.py té una edició sense preparar i notes.md
  és un fitxer nou. No hi ha canvis preparats ni fitxers ignorats.
inici_parlat: >-
  Som a la branca salutació, a mitja feina. Hem modificat el programa i hem creat un fitxer de notes, però
  encara no ho volem confirmar.
preparacio:
  - repositori: HelloGit
  - fitxer: helloGit.py
    contingut: print("Hello Git")
  - git: add helloGit.py
  - commit: A
    missatge: Afegeix la salutacio inicial
  - fitxer: helloGit.py
    contingut: print("Hello Git!")
  - git: commit -q -am "Afegeix una exclamacio"
  - etiqueta: B
  - git: switch -q -c salutacio
  - fitxer: helloGit.py
    contingut: print("Hola, Ermessenda!")
  - fitxer: notes.md
    contingut: Pendent - provar altres noms

etapes:
  - explica: Una interrupció
    pantalla:
      - "Feina a mitges:  helloGit.py modificat"
      - "Fitxer nou:  notes.md"
      - "Urgent:  correcció a main"
    text: >-
      Ens demanen una correcció urgent a [[main]]. No volem barrejar-hi la feina a mitges, ni confirmar-la
      encara. L’aparcarem un moment.
    visual: Dues targetes, helloGit.py MODIFICAT i notes.md NOU. main i salutacio a B.

  - plantilla: status-breu
    resultat: >-
      El programa apareix modificat sense preparar, i les notes, com a fitxer nou. Cap dels dos canvis és
      a l’historial.
    comprova: {status: " M helloGit.py\n?? notes.md"}

  - ordre: git stash push -u -m "Salutacio pendent"
    text: "[[git stash push]] desa la feina pendent en una entrada temporal."
    parts:
      - -u: El guionet u inclou també els fitxers nous. Els fitxers ignorats queden fora.
      - -m: El guionet ema introdueix un missatge per reconèixer l’entrada.
      - '"Salutacio pendent"': Descriu la feina aparcada, la salutació pendent.
    resultat: >-
      El programa torna a la versió confirmada i les notes desapareixen de la carpeta. Els canvis són a
      l’entrada temporal; la branca no ha avançat.
    visual: Els dos continguts viatgen a una caixa STASH. main i salutacio continuen a B.
    comprova:
      status: ""
      stash: 1
      no_existeix: [notes.md]
      refs: {salutacio: B}

  - ordre: git stash list
    text: Consultem les entrades guardades.
    resultat: Apareix una entrada amb el seu número i el missatge que hem escrit. És feina aparcada, no un commit de la branca.
    visual: Ressaltar stash@{0} i el missatge com a parts de la mateixa entrada a la sortida real.
    comprova:
      sortida: ["stash@{0}: On salutacio: Salutacio pendent"]

  - plantilla: switch
    branca: main
    resultat: >-
      Amb la carpeta neta, podríem fer la correcció a [[main]]. Per no allargar l’exemple, ometem aquesta
      correcció i tornem a la nostra feina.
    comprova: {head: main}

  - plantilla: switch
    branca: salutacio
    resultat: Tornem a la branca de la salutació abans de recuperar-hi els canvis.
    comprova: {head: salutacio}

  - ordre: git stash pop
    text: "[[git stash pop]] recupera els canvis i retira l’entrada si tot va bé."
    resultat: >-
      Tornen la salutació modificada i les notes. Continuen sent feina pendent, sense confirmar.
    visual: S’obre la caixa STASH i cada contingut torna al seu fitxer. Cap node nou.
    comprova:
      status: " M helloGit.py\n?? notes.md"
      stash: 0
      programa: Hola, Ermessenda!

  - ordre: git stash list
    text: Comprovem la llista després de recuperar-la.
    resultat: >-
      Ara és buida, perquè els canvis s’han aplicat bé. Si hi hagués hagut un conflicte, l’entrada no
      s’hauria esborrat.
    visual: Llista buida amb la llegenda CAP ENTRADA; panell condicional separat per al cas amb conflicte.
    comprova: {stash: 0}

  - explica: Conservar l’entrada
    pantalla:
      - "Recupera i retira l’entrada:  git stash pop"
      - "Recupera i la conserva:  git stash apply"
    text: >-
      [[git stash apply]] també recupera els canvis, però conserva l’entrada. És una alternativa a [[pop]];
      no cal fer servir totes dues ordres per recuperar la mateixa feina.
    visual: Comparació APPLY · conserva l’entrada / POP · la retira si s’aplica bé.

resum:
  - "[[Stash]] aparca la feina pendent sense fer avançar la branca."
  - El guionet u hi inclou els fitxers nous, però no els ignorats.
  - En recuperar-la, la feina torna al treball; encara caldrà confirmar-la.
practica: >-
  En un repositori de pràctiques, aparca una edició i un fitxer nou. Consulta l’entrada, canvia de branca
  i torna, i recupera la feina amb la carpeta neta.
