titol: "Rebase: continua sobre una base nova"
titol_curt: REBASE
capcalera: [REBASE, Continua sobre una base nova]
presentacio: "[[Rebase]]"
objectiu: tornar a aplicar els commits propis sobre una base actualitzada i veure per què canvien d’identificador.
inici: >-
  Branca activa main. salutacio té C (salutació) i E (notes.md) sobre B, sense publicar. main ha avançat a D
  amb un README.md. Treball net; canvis compatibles.
inici_parlat: >-
  La nostra branca salutació té dos commits propis, encara no publicats. Mentrestant, [[main]] ha avançat
  amb un commit nou en un altre fitxer.
preparacio:
  - repositori: HelloGit
  - fitxer: helloGit.py
    contingut: print("Hello Git")
  - git: add helloGit.py
  - commit: A
    missatge: Afegeix la salutacio inicial
  - fitxer: helloGit.py
    contingut: print("Hello Git!")
  - git: commit -q -am "Afegeix una exclamacio"
  - etiqueta: B
  - git: switch -q -c salutacio
  - fitxer: helloGit.py
    contingut: print("Hola, Ermessenda!")
  - git: commit -q -am "Personalitza la salutacio"
  - etiqueta: C
  - fitxer: notes.md
    contingut: La salutació es personalitza per a l’Ermessenda.
  - git: add notes.md
  - commit: E
    missatge: Documenta la salutacio
  - git: switch -q main
  - fitxer: README.md
    contingut: Projecte HelloGit
  - git: add README.md
  - commit: D
    missatge: Afegeix el README

camins:
  conflicte:
    tipus: condicional
    titol: Si hi ha conflicte
    des_de: inici
    preparacio:
      - fitxer: helloGit.py
        contingut: print("Hola, classe!")
      - git: commit -q -am "Saluda la classe"
      - etiqueta: X
      - git: switch -q salutacio
      - git: rebase main
        falla: true
  avorta:
    tipus: alternatiu
    titol: Alternativa
    des_de: inici
    preparacio:
      - fitxer: helloGit.py
        contingut: print("Hola, classe!")
      - git: commit -q -am "Saluda la classe"
      - git: switch -q salutacio
      - git: rebase main
        falla: true

etapes:
  - explica: Una base que ha avançat
    pantalla:
      - "main:  nou commit amb README.md"
      - "salutacio:  dos commits propis"
      - "Encara no publicats"
    text: >-
      Volem continuar la nostra feina a partir de la versió actual de [[main]]. La branca salutació té
      dos commits propis que encara no hem compartit.
    visual: B com a base; main a D; salutacio a E passant per C. Etiqueta NO PUBLICATS sobre C i E.

  - plantilla: switch
    branca: salutacio
    resultat: Som a la branca que tornarem a construir. [[main]] farà de base i no es mourà.
    comprova: {head: salutacio}

  - ordre: git rebase main
    text: "[[git rebase]] torna a aplicar els commits de la branca activa a partir d’una altra base."
    parts:
      - main: És la nova base. No és la branca on integrem la feina.
    crea: E′
    despres:
      - etiqueta: C′
        ref: HEAD~1
    resultat: >-
      Els dos canvis s’han tornat a aplicar a continuació de [[main]]. Són commits nous: tenen un altre pare
      i un altre identificador.
    visual: Atenuar C i E; dibuixar C′ i E′ a partir de D. No moure els nodes originals com si fossin els mateixos.
    comprova:
      pares: {C′: [D], E′: [C′]}
      refs: {main: D, salutacio: E′}
      existeix: [README.md, notes.md]

  - explica: Seguim un canvi concret
    pantalla:
      - "Mateix canvi:  C i C′"
      - "Pare diferent:  B → D"
      - "Identificador diferent"
    text: >-
      La salutació que introduïa el primer commit també és a la seva còpia nova, ara a continuació de [[main]].
      El contingut es conserva, però l’historial és diferent, perquè ha canviat el pare.
    visual: Comparar el mateix canvi a C i C′; després, ressaltar els pares B i D.

  - ordre: git log --oneline --graph --all
    text: Revisem l’historial després de l’operació.
    parts:
      - --graph: Dibuixa amb línies com es connecten els commits.
    resultat: >-
      [[main]] continua al seu lloc i salutació apunta al final de la línia nova. Encara no hem integrat
      la feina a [[main]].
    visual: Sortida real del graf amb una llegenda de les branques.

  - explica: Comparació amb merge
    pantalla:
      - "merge:  commit de fusió amb dos pares"
      - "rebase:  commits propis en una sola línia"
    text: >-
      Des del mateix punt de partida, [[merge]] uniria els dos camins amb un commit de dos pares. [[Rebase]]
      reconstrueix els commits propis a continuació de la base nova, en una sola línia.
    visual: Dos grafs, un al costat de l’altre, amb el mateix estat inicial. No executar una operació després de l’altra.

  - explica: Si apareix un conflicte
    pantalla:
      - "Rebase pausat"
      - "Resolem:  print(\"Hola, grup!\")"
      - "Després:  provar, add i --continue"
    cami: conflicte
    text: >-
      En un altre cas, [[main]] havia canviat la mateixa línia i el [[rebase]] s’atura. Escrivim el contingut
      correcte i el provem.
    visual: Separador SI HI HA CONFLICTE; indicador REBASE PAUSAT. El camí principal no tenia conflictes.
    accions:
      - fitxer: helloGit.py
        contingut: print("Hola, grup!")

  - plantilla: programa
    cami: conflicte
    resultat: La resolució funciona.
    comprova: {programa: "Hola, grup!"}

  - plantilla: add-breu
    cami: conflicte
    resultat: La resolució queda preparada per continuar.

  - ordre: git rebase --continue
    cami: conflicte
    text: Reprenem el [[rebase]] pausat.
    parts:
      - --continue: Continua l’operació. Si hi ha més conflictes, repetim el mateix procés.
    resultat: >-
      Pot obrir l’editor amb el missatge del commit; el desem i el tanquem. El [[rebase]] acaba amb la
      resolució que hem decidit.
    visual: Pestanya de l’editor amb el missatge; en tancar-la, la línia nova queda completa.
    comprova:
      status: ""
      programa: Hola, grup!

  - explica: Alternativa, abandonar el rebase
    pantalla:
      - "Continuar:  git rebase --continue"
      - "Abandonar:  git rebase --abort"
    cami: avorta
    text: Des del mateix conflicte, també podem abandonar l’operació en lloc de continuar-la.
    visual: Bifurcació CONTINUAR / AVORTAR, sense executar les dues opcions seguides.

  - ordre: git rebase --abort
    cami: avorta
    text: Cancel·lem el [[rebase]] pendent.
    parts:
      - --abort: Torna la branca a l’estat d’abans de començar.
    resultat: La branca salutació torna a tenir els seus commits originals, com si no haguéssim començat.
    visual: Tornar al graf inicial de salutacio.
    comprova:
      refs: {salutacio: E}
      status: ""

resum:
  - "[[Rebase]] canvia la base de la branca activa."
  - Els commits tornats a aplicar tenen identificadors nous; [[main]] no es mou.
  - Només fem [[rebase]] de feina pròpia que encara no hem publicat.
practica: >-
  En una branca local de pràctiques amb canvis compatibles, torna a aplicar la teva feina sobre [[main]].
  Compara el graf i prova el resultat.
