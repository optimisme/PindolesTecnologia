titol: "Tags: identifica una entrega del projecte"
titol_curt: TAGS
capcalera: [TAGS, Identifica una entrega del projecte]
presentacio: "[[Tags]]"
objectiu: marcar una entrega amb una etiqueta anotada i publicar-la.
inici: >-
  main i origin/main a B, treball net i programa provat. Encara no hi ha cap etiqueta.
inici_parlat: >-
  Hem acabat la primera entrega del projecte. Està confirmada, publicada i provada.
preparacio:
  - remot_nu: origin
  - clona: HelloGit
    de: origin
  - cd: HelloGit
  - fitxer: helloGit.py
    contingut: print("Hello Git")
  - git: add helloGit.py
  - commit: A
    missatge: Afegeix la salutacio inicial
  - fitxer: helloGit.py
    contingut: print("Hello Git!")
  - git: commit -q -am "Afegeix una exclamacio"
  - etiqueta: B
  - git: push -q -u origin main

etapes:
  - explica: Un nom per a una entrega
    pantalla:
      - "Entrega:  commit B"
      - "Nom fix:  v1.0"
      - "La branca avança; l’etiqueta, no."
    text: >-
      El projecte continuarà canviant, però volem poder tornar a aquesta entrega. Una etiqueta posa un nom
      fix a un commit concret.
    visual: Graf A i B; main a B. Targeta ENTREGA amb el programa provat.

  - plantilla: programa
    resultat: La versió que entregarem funciona.
    comprova: {programa: Hello Git!}

  - plantilla: status-breu
    resultat: No hi ha canvis pendents. L’etiqueta assenyalarà el commit; una edició sense confirmar no hi entraria.
    comprova: {status: ""}

  - ordre: git tag -a v1.0 -m "Primera entrega"
    text: Creem l’etiqueta amb [[git tag]].
    parts:
      - -a: El guionet a crea una etiqueta anotada, amb autoria, data i missatge propis.
      - v1.0: És el nom de l’entrega, versió u punt zero.
      - -m: El guionet ema introdueix el missatge de l’etiqueta.
      - '"Primera entrega"': Descriu què representa aquest punt del projecte.
    resultat: L’etiqueta apunta al commit actual. No afegeix cap commit a la història de [[main]].
    visual: Etiqueta v1.0 al costat de B, sense cap node nou.
    comprova:
      refs: {v1.0: B}
      commits: {ref: main, nombre: 2}

  - ordre: git show v1.0
    text: Revisem l’etiqueta creada.
    resultat: Primer surten les dades de l’etiqueta i, després, el commit al qual apunta.
    visual: Separar a la sortida real DADES DE L’ETIQUETA i COMMIT ASSOCIAT.
    comprova:
      sortida: [tag v1.0, Primera entrega, Afegeix una exclamacio]

  - explica: Continuem treballant
    pantalla:
      - "helloGit.py:  print(\"Hola, Ermessenda!\")"
      - "main avançarà amb un commit nou."
      - "v1.0 es queda a l’entrega."
    text: >-
      Després de l’entrega, canviem la salutació, la preparem i la confirmem. La branca avançarà; l’etiqueta,
      no.
    visual: Editor amb print("Hola, Ermessenda!") abans de preparar i confirmar.
    accions:
      - fitxer: helloGit.py
        contingut: print("Hola, Ermessenda!")

  - plantilla: add-breu
    resultat: La salutació nova queda preparada.

  - plantilla: commit-breu
    missatge: Canvia la salutacio
    crea: C
    resultat: "[[main]] avança. L’etiqueta de la versió u punt zero continua assenyalant l’entrega."
    comprova:
      refs: {main: C, v1.0: B}

  - ordre: git show v1.0:helloGit.py
    text: Llegim el fitxer tal com era a l’entrega, sense canviar el treball.
    parts:
      - v1.0:helloGit.py: Abans dels dos punts, la versió; després, el fitxer dins d’aquella versió.
    resultat: Surt la salutació de l’entrega. L’editor continua amb la salutació nova.
    visual: Dos panells, CONSULTA DE V1.0 i FITXER ACTUAL. Cap fletxa que sobreescrigui el treball.
    comprova:
      sortida: [print("Hello Git!")]
      programa: Hola, Ermessenda!

  - plantilla: push
    resultat: El remot rep el commit nou. Les etiquetes no s’envien amb un [[push]] normal.
    comprova:
      remot: {origin: {main: C, v1.0: null}}

  - ordre: git push origin v1.0
    text: Publiquem l’etiqueta explícitament.
    parts:
      - origin: És el remot del projecte.
      - v1.0: Indiquem l’etiqueta que enviem, en lloc d’una branca.
    resultat: >-
      El remot també coneix l’entrega pel seu nom. Això no crea per si sol una publicació de tipus
      [[Release]] a [[GitHub]].
    visual: main a C i v1.0 a B, tant al local com al remot.
    comprova:
      remot: {origin: {v1.0: B}}

resum:
  - Una branca avança; una etiqueta queda fixa al commit de l’entrega.
  - L’etiqueta anotada té dades pròpies i no afegeix cap commit.
  - Les etiquetes es publiquen explícitament.
practica: >-
  Marca una versió provada d’un repositori de pràctiques amb una etiqueta anotada. Fes un commit posterior
  i llegeix el fitxer de l’etiqueta sense canviar l’editor.
