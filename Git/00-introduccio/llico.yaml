titol: 'Introducció a Git: versions, historial i col·laboració'
titol_curt: INTRODUCCIÓ
capcalera:
- INTRODUCCIÓ A GIT
- Versions, historial i col·laboració
presentacio: Introducció a [[Git]]
tipus: conceptual
etiquetatge: explicit
objectiu: entendre per què serveix un sistema de control de versions abans d’escriure cap ordre.
inici: >-
  No cal executar cap comanda. Lliçó conceptual prèvia a la primera pràctica.
inici_parlat: No cal tenir res instal·lat per seguir aquesta lliçó.
escenes:
- id: g_problema
  etiqueta: EL PUNT DE PARTIDA
  titol: Un projecte canvia cada dia
  visual: >-
    Un projecte web evoluciona; després, tres còpies amb noms final, final2 i final-definitiu mostren
    la dificultat de seguir els canvis.
  passos:
  - id: canvis
    vista: project
    text: >-
      Un projecte canvia cada dia. Afegim una pàgina, corregim un error o tornem a una idea anterior.
      Amb el temps, necessitem entendre com hem arribat fins aquí.
    pausa: 2.5
  - id: copies
    vista: copies
    text: >-
      Acumular carpetes amb noms com final i definitiu fa difícil saber què conté cadascuna. També complica
      combinar la feina de diverses persones.
    pausa: 3
- id: g_historial
  etiqueta: CONTROL DE VERSIONS
  titol: Git organitza la història del projecte
  visual: >-
    Historial de tres versions identificades amb missatges. El conjunt forma part del repositori, sense
    mostrar comandes.
  passos:
  - id: git
    vista: history
    text: >-
      [[Git]] és un sistema de control de versions. Permet registrar l’estat d’un projecte i consultar
      després la seva evolució.
    pausa: 2.5
  - id: registre
    vista: records
    text: >-
      Cada registre, anomenat [[commit]], identifica una versió i inclou un missatge que explica el canvi.
      El repositori conserva aquest historial.
    pausa: 3
- id: g_comparar
  etiqueta: ENTENDRE ELS CANVIS
  titol: Comparar ajuda a investigar
  visual: >-
    Dues versions de la mateixa pàgina amb la línia del menú modificada; fletxa cap a la comparació i
    ressaltat del canvi.
  passos:
  - id: diferencies
    vista: compare
    text: >-
      Podem comparar dues versions per veure què ha canviat. Si una modificació introdueix un problema,
      l’historial ens dona un punt de partida per investigar-lo.
    pausa: 3
- id: g_local
  etiqueta: AL TEU ORDINADOR
  titol: El repositori local conserva les versions
  visual: >-
    Ordinador amb historial propi. Es manté visible quan s’apaga la connexió a internet.
  passos:
  - id: local
    vista: local
    text: >-
      [[Git]] funciona al teu ordinador. Pots registrar i consultar versions sense connexió a internet.
      La informació queda al repositori local.
    pausa: 3
- id: g_compartir
  etiqueta: TREBALL EN EQUIP
  titol: Compartir i integrar la feina
  visual: >-
    Dos ordinadors i un servei remot amb fletxes de compartir. Git i GitHub tenen etiquetes separades.
  passos:
  - id: servei
    vista: remote
    text: >-
      [[GitHub]] és un servei on podem allotjar repositoris i compartir-los. És una de les eines que podem
      utilitzar amb [[Git]].
    pausa: 2.5
  - id: equip
    vista: team
    text: >-
      Cada persona pot treballar amb la seva còpia i compartir després les versions. La integració permet
      reunir els canvis i revisar el resultat.
    pausa: 3
- id: g_criteri
  etiqueta: REGISTRAR I REVISAR
  titol: Les decisions continuen sent nostres
  visual: >-
    Editor i historial diferenciats. Desar al fitxer no crea un nou registre. Revisar i provar són passos
    humans.
  passos:
  - id: decidir
    vista: intentional
    text: >-
      El projecte no es registra a cada tecla. Nosaltres decidim quan guardem una versió a l’historial.
      Desar un fitxer a l’editor és una acció diferent.
    pausa: 3
  - id: provar
    vista: review
    text: >-
      Una versió registrada tampoc garanteix que tot funcioni bé. Cal revisar els canvis i comprovar el
      resultat del programa.
    pausa: 3
- id: g_resum
  etiqueta: PER COMENÇAR
  titol: Registrar. Comparar. Col·laborar.
  visual: >-
    Tres idees generals, ressaltades una per una. La pròxima lliçó introduirà les comandes.
  passos:
  - id: resum
    vista: summary
    text: >-
      [[Git]] ens ajuda a conservar versions, entendre les diferències i coordinar la feina. Aquestes
      són les tres idees amb què comencem.
    pausa: 3
  - id: seguent
    vista: next
    text: >-
      A la lliçó següent prepararem l’ordinador per treballar amb [[Git]]. Després guardarem i publicarem
      la primera versió d’un projecte, pas a pas.
    pausa: 3
